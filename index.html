<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>People Performance</title>
    <link rel="icon" type="image/png" href="/images/logo-favicon.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var d = document.documentElement
          var m = localStorage.getItem('app-theme-mode')
          var t = localStorage.getItem('app-theme-color')
          if (m === 'custom' && t && /^#[0-9A-Fa-f]{6}$/.test(t))
            d.style.setProperty('--color-theme', t.toLowerCase())
          else if (m !== 'custom') d.style.removeProperty('--color-theme')
          var a = localStorage.getItem('app-appearance') || 'system'
          var dark =
            a === 'dark' ||
            (a !== 'light' &&
              matchMedia('(prefers-color-scheme:dark)').matches)
          d.classList.toggle('dark', dark)
          d.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
